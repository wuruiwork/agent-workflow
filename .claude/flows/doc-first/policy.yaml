# doc-first 流程的 skillgate 策略。
# 复制到目标项目的 .skillgate/done.yaml 后生效。
# 用法：
#   npx --yes @reneza/skillgate@0.16.0 phase          # 查看各阶段状态
#   npx --yes @reneza/skillgate@0.16.0 phase brief    # 标记 brief 阶段完成（brief 门禁通过才写入）
#   npx --yes @reneza/skillgate@0.16.0 check          # 检查全部门禁
#   npx --yes @reneza/skillgate@0.16.0 gate --command "git push"

name: doc-first

# 只拦 push；本地 commit 允许，方便分阶段保存。
# 阶段边界可能随时 push（现场验证可能在流程中途），所以产物 gate 用
# when.changed 限定：只有对应产物进入本分支 diff 时才检查。
# 尚未产生的产物不会阻断早期 push；归档后的最终 push 会检查全部产物。
finishLine:
  - "git push"

timeout: 600000

gates:
  - id: brief-approved
    type: file-contains
    file: docs/specs/current/00-brief.md
    pattern: "status: approved"
    when:
      changed: ["docs/specs/*/00-brief.md"]

  - id: design-approved
    type: file-contains
    file: docs/specs/current/10-design.md
    pattern: "status: approved"
    when:
      changed: ["docs/specs/*/10-design.md"]

  - id: tasks-approved
    type: file-contains
    file: docs/specs/current/20-tasks.md
    pattern: "status: approved"
    when:
      changed: ["docs/specs/*/20-tasks.md"]

  - id: impl-done
    type: file-contains
    file: docs/specs/current/30-impl.md
    pattern: "status: done"
    when:
      changed: ["docs/specs/*/30-impl.md"]

  - id: review-pass
    type: file-contains
    file: docs/specs/current/35-review.md
    pattern: "status: pass"
    when:
      changed: ["docs/specs/*/35-review.md"]

  - id: verify-pass
    type: file-contains
    file: docs/specs/current/40-verify.md
    pattern: "status: pass"
    when:
      changed: ["docs/specs/*/40-verify.md"]

  # 必须改成项目自己的测试命令。默认故意失败，避免没配置就放行。
  # 只在验证产物落地后检查，允许实现阶段的早期 push。
  - id: tests-pass
    type: command
    timeout: 540000
    run: |
      sh -c 'echo "TODO: 把 .skillgate/done.yaml 的 tests-pass 改成项目测试命令"; exit 1'
    when:
      changed: ["docs/specs/*/40-verify.md"]

  # 文档治理：先以 warn 接入；清理后把 level: warn 改成 block。
  - id: instruction-sync
    type: instruction-sync
    level: warn

  - id: instruction-refs
    type: instruction-refs
    level: warn

  - id: archive-done
    type: file-exists
    file: docs/specs/current/40-verify.md
    when:
      changed: ["docs/specs/INDEX.md"]

  - id: archive-indexed
    type: command
    run: |
      sh -c 'test -L docs/specs/current && grep -q "$(basename "$(readlink docs/specs/current)")" docs/specs/INDEX.md'
    when:
      changed: ["docs/specs/INDEX.md"]

  # 只有分支里出现流程产物时才启用阶段门禁，
  # 否则普通改动（不经过 doc-first 流程）会被 brief 阶段一直卡住。
  - id: phases
    type: phase
    when:
      changed: ["docs/specs/**"]
    phases:
      - id: brief
        requires: [brief-approved]
      - id: design
        requires: [design-approved]
      - id: tasks
        requires: [tasks-approved]
      - id: implement
        requires: [impl-done]
      - id: review
        requires: [review-pass]
      - id: verify
        requires: [verify-pass, tests-pass]
      - id: archive
        requires: [archive-done, archive-indexed]
