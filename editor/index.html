<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workflow editor · agent-workflow</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <strong>agent-workflow</strong>
      <span class="muted" data-i18n="brand.sub">Workflow editor</span>
    </div>
    <div class="env" id="env"></div>
    <div class="topbar-actions">
      <select id="lang-select" class="input lang-select" aria-label="Language">
        <option value="en">English</option>
        <option value="zh">中文</option>
      </select>
      <span id="status" class="status"></span>
      <button id="btn-save-flow" class="btn primary" data-i18n="btn.saveFlow">Save flow</button>
      <button id="btn-save-profile" class="btn" data-i18n="btn.saveProfile">Save profile</button>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <div class="panel-title" data-i18n="side.flows">Flows</div>
      <div id="flow-list" class="flow-list"></div>
      <button id="btn-new-flow" class="btn ghost wide" data-i18n="side.newFlow">＋ New flow</button>

      <div class="panel-title" data-i18n="side.workspace">Workspace (cache)</div>
      <select id="workspace-select" class="input"></select>
      <button id="btn-new-workspace" class="btn ghost wide" data-i18n="side.newWorkspace">＋ New workspace</button>
      <p class="hint" data-i18n-html="side.workspaceHint"></p>

      <div class="panel-title" data-i18n="side.project">Current project</div>
      <div id="project-info" class="project-info"></div>
      <div class="row">
        <input id="project-input" class="input" placeholder="/path/to/project">
        <button id="btn-connect" class="btn" data-i18n="side.connect">Connect</button>
      </div>
      <p class="hint" data-i18n-html="side.projectHint"></p>
    </aside>

    <section class="canvas">
      <div id="flow-meta" class="flow-meta"></div>
      <div id="flowchart" class="flowchart"></div>
      <div id="stages" class="stages"></div>
    </section>

    <aside class="inspector">
      <div class="tabs">
        <button class="tab active" data-tab="bindings" data-i18n="tab.bindings">Stage actions</button>
        <button class="tab" data-tab="profile" data-i18n="tab.profile">Project config</button>
        <button class="tab" data-tab="skills" data-i18n="tab.skills">Skills</button>
        <button class="tab" data-tab="help" data-i18n="tab.help">Field help</button>
        <button class="tab" data-tab="yaml" data-i18n="tab.advanced">Advanced</button>
      </div>
      <div class="tab-panel active" id="tab-bindings"></div>
      <div class="tab-panel" id="tab-profile"></div>
      <div class="tab-panel" id="tab-skills"></div>
      <div class="tab-panel" id="tab-help"></div>
      <div class="tab-panel" id="tab-yaml"></div>
    </aside>
  </main>

  <script src="/vendor/js-yaml.umd.min.cjs"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
